name: rebuild VOID

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: void
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # raw proposal cache makes daily runs incremental
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: void-raw-${{ github.run_id }}
          restore-keys: void-raw-

      - name: Chapter 1 - DAOs (NEAR RPC, no key)
        run: python -m void dao
        env:
          NEAR_RPC_URL: ${{ vars.NEAR_RPC_URL || 'https://near.drpc.org' }}

      - name: Build verdicts + dashboard data
        run: |
          python -m void build
          mkdir -p docs && cp site/index.html site/data.json site/og.png docs/

      - name: Commit refreshed data
        run: |
          git config user.name "void-bot"
          git config user.email "void-bot@users.noreply.github.com"
          git add data/daos.json site docs
          git diff --cached --quiet || git commit -m "data: daily rebuild $(date -u +%F)"
          git push
